name: Deploy Docker Container

on:
  push:
    branches:
      - deploy

concurrency:
  group: ${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Docker image
        run: |
          docker build --build-arg VITE_API_URL=${{ secrets.VITE_API_URL }} \
                       -t oasys-frontend:latest .

      - name: Tag and Push Docker image
        run: |
          docker tag oasys-frontend:latest ${{ secrets.DOCKER_USERNAME }}/oasys-frontend:latest
          docker push ${{ secrets.DOCKER_USERNAME }}/oasys-frontend:latest

      - name: Deploy to Server
        uses: appleboy/ssh-action@v1
        with:
          host: 103.189.89.187
          username: root
          password: ${{ secrets.SERVER_PASSWORD }}
          port: 22
          script: |
            # Pull the latest Docker image
            docker pull ${{ secrets.DOCKER_USERNAME }}/oasys-frontend:latest

            # Stop and remove existing container if it exists
            if [ "$(docker ps -a -q -f name=insurance-frontend-oasys-frontend-1)" ]; then
                docker stop insurance-frontend-oasys-frontend-1
                docker rm insurance-frontend-oasys-frontend-1
            fi

            # Run the new container
            docker run -d \
             -p 5173:5173 \
             --network shared-app-network \
             --name insurance-frontend-oasys-frontend-1 \
             --restart unless-stopped \
             ${{ secrets.DOCKER_USERNAME }}/oasys-frontend:latest
